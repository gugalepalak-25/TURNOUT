[package]
name = "turnout-scorecard-registry"
version = "0.1.0"
edition = "2021"
description = "Turnout On-Chain Governance Scorecard Registry on NEAR"
authors = ["Turnout Governance Core Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.1.0", features = ["legacy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

